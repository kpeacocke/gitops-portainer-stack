---
- name: Deploy Portainer Server from Git
  hosts: synology
  become: true
  gather_facts: false
  serial: 1
  vars:
    portainer_deploy_path: /volume1/docker/gitops/portainer-stack
    portainer_data_path: /volume1/dkrcfg/portainer
    portainer_port: "9080"
    portainer_timezone: Australia/Sydney
    docker_binary_candidates:
      - /usr/local/bin/docker
      - /var/packages/ContainerManager/target/usr/bin/docker
      - /usr/bin/docker

  pre_tasks:
    - name: Require the Portainer agent secret injected by AWX
      ansible.builtin.assert:
        that:
          - lookup('env', 'PORTAINER_AGENT_SECRET') | length >= 16
        fail_msg: Attach the Portainer Agent Secret credential to this job template
      no_log: true

    - name: Probe Synology Docker binary locations
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ docker_binary_candidates }}"
      register: docker_binary_probe

    - name: Select the installed Docker binary
      ansible.builtin.set_fact:
        portainer_docker_bin: >-
          {{
            docker_binary_probe.results
            | selectattr('stat.exists')
            | map(attribute='item')
            | first
            | default('')
          }}

    - name: Require Docker on the Synology host
      ansible.builtin.assert:
        that:
          - portainer_docker_bin | length > 0
        fail_msg: >-
          Docker was not found in any supported Synology location:
          {{ docker_binary_candidates | join(', ') }}

    - name: Verify Docker Compose is available
      ansible.builtin.command:
        argv:
          - "{{ portainer_docker_bin }}"
          - compose
          - version
      changed_when: false

  tasks:
    - name: Create the Git-controlled deployment directory
      ansible.builtin.file:
        path: "{{ portainer_deploy_path }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install the repository Compose definition
      ansible.builtin.copy:
        src: ../stack/docker-compose.yml
        dest: "{{ portainer_deploy_path }}/compose.yml"
        owner: root
        group: root
        mode: "0640"

    - name: Install runtime environment without exposing secrets
      ansible.builtin.template:
        src: portainer.env.j2
        dest: "{{ portainer_deploy_path }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Validate the rendered Compose definition
      ansible.builtin.command:
        cmd: >-
          {{ portainer_docker_bin }} compose --project-name portainer
          --env-file .env -f compose.yml config --quiet
        chdir: "{{ portainer_deploy_path }}"
      changed_when: false

    - name: Pull the configured Portainer image
      ansible.builtin.command:
        cmd: >-
          {{ portainer_docker_bin }} compose --project-name portainer
          --env-file .env -f compose.yml pull
        chdir: "{{ portainer_deploy_path }}"
      changed_when: true

    - name: Reconcile the Portainer container from Git
      ansible.builtin.command:
        cmd: >-
          {{ portainer_docker_bin }} compose --project-name portainer
          --env-file .env -f compose.yml up -d --remove-orphans
        chdir: "{{ portainer_deploy_path }}"
      register: compose_up
      changed_when: >-
        'Created' in compose_up.stdout or
        'Recreated' in compose_up.stdout or
        'Started' in compose_up.stdout

    - name: Wait for the local Portainer endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ portainer_port }}/api/status"
        status_code: 200
        return_content: false
      register: portainer_status
      retries: 12
      delay: 5
      until: portainer_status.status == 200

    - name: Read Portainer Compose source label
      ansible.builtin.command:
        argv:
          - "{{ portainer_docker_bin }}"
          - inspect
          - portainer
          - --format
          - "{% raw %}{{ index .Config.Labels \"com.docker.compose.project.config_files\" }}{% endraw %}"
      register: portainer_config_path
      changed_when: false
      failed_when: portainer_deploy_path not in portainer_config_path.stdout
