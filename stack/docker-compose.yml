services:
  portainer:
    image: portainer/portainer-ee:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9080}:9000"
    environment:
      - TZ=${TZ:-Australia/Sydney}
      - PORTAINER_LICENSE=${PORTAINER_LICENSE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PORTAINER_DATA_PATH:-./portainer-data}:/data
    networks:
      - portainer_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  portainer_public:
    driver: bridge
